# NOI Contest Management System
# Start:   docker compose up -d --build        (or scripts\start.ps1 on Windows)
# Config:  copy .env.example to .env and change the passwords first.
name: noi-cms

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: noi
      POSTGRES_USER: noi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noi -d noi"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *restart
    image: noi-cms-api:${NOI_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://noi:${POSTGRES_PASSWORD}@postgres:5432/noi
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      SINGLE_SESSION: ${SINGLE_SESSION:-1}
      SESSION_HOURS: ${SESSION_HOURS:-24}
      SUBMIT_PER_MINUTE: ${SUBMIT_PER_MINUTE:-6}
      TZ: ${TZ:-UTC}
    volumes:
      - filedata:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    <<: *restart
    image: noi-cms-worker:${NOI_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    # isolate needs to create sandboxes and cgroups; the container is not reachable from outside.
    privileged: true
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_INTERNAL_URL: http://api:3000
      WORKER_TOKEN: ${WORKER_TOKEN}
      JUDGE_SLOTS: ${JUDGE_SLOTS:-2}
    depends_on:
      api: { condition: service_healthy }
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

  web:
    <<: *restart
    image: noi-cms-web:${NOI_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - caddydata:/data
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  filedata:
  caddydata:
